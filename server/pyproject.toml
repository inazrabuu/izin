[project]
name = "izin-server"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pydantic-settings>=2.4",
  "alembic>=1.20.0",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "izin[langgraph]",
    "ruff>=0.17.2",
]

[tool.uv.sources]
izin = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["izin_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
