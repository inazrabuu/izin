<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- izin: an office rubber stamp ("cap") pressed at a slight angle -->
  <g transform="rotate(-12 32 32)">
    <circle cx="32" cy="32" r="30" fill="#ffffff"/>
    <!-- outer ring with a small gap where the ink didn't take -->
    <circle cx="32" cy="32" r="26.5" fill="none" stroke="#4b3fb5" stroke-width="5"
            stroke-dasharray="152 14.5" stroke-dashoffset="-20"/>
    <!-- the approval tick -->
    <path d="M19.5 33.5 L28 42 L45 23.5" fill="none" stroke="#4b3fb5" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
