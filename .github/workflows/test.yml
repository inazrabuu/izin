name: test
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        images: postgres:16
        env:
          {
            POSTGRES_USER: izin,
            POSTGRES_PASSWORD: izin,
            POSTGRES_DB: izin_test,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U izin" --health_invterval 2s
          --health-timeout 3s --health_retries 15
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  inbox:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: inbox } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: inbox/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
