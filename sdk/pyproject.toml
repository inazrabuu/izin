[project]
name = "izin"
version = "0.1.0"
description = "Human approval for AI agents"
requires_python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["izin"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--strict-config"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
