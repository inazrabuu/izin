services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: izin
      POSTGRES_PASSWORD: izin
      POSTGRES_DATABASE: izin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izin -d izin"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
